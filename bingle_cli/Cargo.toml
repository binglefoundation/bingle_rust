[package]
name = "bingle_cli"
version = "0.2.8"
edition = "2024"
description = "Command line interface for Bingle: register handles, run nodes/relays, and trade BINGLE on Algorand."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
autotests = false

[[bin]]
name = "bingle_cli"
path = "src/main.rs"

[build-dependencies]
vergen = { version = "8", features = ["build", "git", "gitcl", "cargo"] }

[dependencies]
bingle_core = { path = "../bingle_core", version = "0.2.8" }
bingle_local = { path = "../bingle_local", version = "0.2.8" }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
# `localnet` feature brings in the reusable algokit-localnet harness (and enables bingle_core's
# test-hooks) used by the localnet chat e2e.
bingle_test = { path = "../bingle_test", features = ["localnet"] }
tempfile = "3"
serial_test = "3"
ntest = "0.9"

# Unit tests: local CLI tests with no external resource requirements.
[[test]]
name = "unit"
path = "tests/unit.rs"

# Integration tests: drive the compiled binary. The offline cases run everywhere; the live-chain
# registration cases are #[ignore]d and need a localnet (run with `--ignored` and the env vars they
# document).
[[test]]
name = "integration"
path = "tests/integration.rs"

# Localnet e2e: provisions relays/STUN/app/accounts via bingle_test::localnet and drives the compiled
# `bingle_cli chat` binary against a running algokit localnet. Skips cleanly when localnet is down.
[[test]]
name = "localnet"
path = "tests/localnet_chat_e2e.rs"

[lints]
workspace = true
