# Rust doesn't inherit IPHONEOS_DEPLOYMENT_TARGET for its linker — it defaults
# to iOS 10.0.  OpenSSL (vendored) compiles against the current SDK and uses
# symbols like `___chkstk_darwin` that were added in iOS 13.  Set the linker
# target explicitly here so the two sides agree on the minimum deployment target.

[target.aarch64-apple-ios]
rustflags = [
    "-C", "link-arg=-target",
    "-C", "link-arg=arm64-apple-ios13.0",
]

[target.aarch64-apple-ios-sim]
rustflags = [
    "-C", "link-arg=-target",
    "-C", "link-arg=arm64-apple-ios13.0-simulator",
]

[target.x86_64-apple-ios]
rustflags = [
    "-C", "link-arg=-target",
    "-C", "link-arg=x86_64-apple-ios13.0-simulator",
]
