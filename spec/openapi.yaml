openapi: 3.0.3
info:
  title: Bingle Message API
  version: 0.1.0
  description: |
    OpenAPI 3 specification for a message-based interface.

    Messages are polymorphic based on the pair of fields `app` and `type`:
    - When both `app` and `type` are present and non-null, the message is a typed message and
      its specific class is determined by the values of (`app`, `type`).
    - When `app` and `type` are null or not present, the message is a plain text message with a single
      string field `text`.

    Notes on modeling:
    - OpenAPI 3.0 only supports a single-field discriminator, so we model the (`app`, `type`) based
      polymorphism with `oneOf` and schema constraints. Specific typed messages can be defined by
      constraining `app` and `type` with single-value enums in composed schemas.
  contact:
    name: Bingle
    url: https://example.com
servers:
  - url: https://example.com/api
    description: Placeholder server URL (adjust as needed)

paths: {}

components:
  schemas:
    PlainTextMessage:
      type: object
      description: |
        Plain text message without `app` and `type` fields present.
      required:
        - text
      properties:
        text:
          type: string
          description: Message text content
      additionalProperties: false

    PlainTextMessageWithNulls:
      type: object
      description: |
        Plain text message that explicitly includes `app` and `type` set to null.
      required:
        - text
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for a plain text message variant that explicitly includes these fields
        type:
          nullable: true
          enum: [null]
          description: Must be null for a plain text message variant that explicitly includes these fields
        text:
          type: string
          description: Message text content
      additionalProperties: false

    TypedMessage:
      type: object
      description: |
        A typed message indicated by the presence of non-null `app` and `type` fields.
        Specific message classes should be defined by constraining `app` and `type` to
        single values (via single-value enums) and by refining the payload shape.
      required:
        - app
        - type
      properties:
        app:
          type: string
          description: Application namespace identifier for the message class
        type:
          type: string
          description: Type identifier within the application namespace
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag instructing responders which tag to echo back.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
      additionalProperties: true
      example:
        app: "chat"
        type: "markdown"
        text: "Hello"
        data:
          markdown: "**Hello**"

    # Example of a specialized typed message schema (optional pattern)
    ChatMarkdownMessage:
      type: object
      description: Example of a specialized typed message schema (optional pattern)
      properties:
        app:
          type: string
          enum: ["chat"]
          description: chat
        type:
          type: string
          enum: ["markdown"]
          description: markdown
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag instructing responders which tag to echo back.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          required: [markdown]
          properties:
            markdown:
              type: string
          additionalProperties: false
      required: [app, type]
      additionalProperties: true

    # Requests (type values from CommandTypeAdapter)
    DdbUpsertResolve:
      type: object
      description: |
        Update or insert the advertisement record for a node.
        If the record (identified by `startId`) exists it is updated.
        If the record does not exist it is inserted.
        The message ripples onward to all configured nodes in the graph.
        The payload is an `AdvertRecord` describing how to connect to the node.
        A `DdbUpdateResponse` is sent back to the sender.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["upsertResolve"]
          description: upsertResolve
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        startId:
          type: string
          description: The identifier of the node making the original request, an Algorand address.
        epoch:
          type: integer
          description: The epoch number of the database graph configuration.
        record:
          $ref: '#/components/schemas/AdvertRecord'
        originalSignature:
          type: string
          description: A ed25519 signature of `startId` + `epoch`+ `record` by the node making the request.
        rippled:
          type: boolean
          description: True if the message was rippled to the database.
      required: [app, type, startId, epoch, record, originalSignature, rippled]
      additionalProperties: true

    DdbDeleteResolve:
      type: object
      description: |
        Delete the advertisement record for a node.
        The message ripples onward to all configured nodes in the graph.
        A `DdbUpdateResponse` is sent back to the sender.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["deleteResolve"]
          description: deleteResolve
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        startId:
          type: string
          description: The identifier of the node making the original request, an Algorand address.
        epoch:
          type: integer
          description: The epoch number of the database graph configuration.
        originalSignature:
          type: string
          description: A ed25519 signature of `startId` + `epoch` by the node making the request.
        rippled:
          type: boolean
          description: True if the message was rippled to the database.
      required: [app, type, startId, epoch, originalSignature, rippled]
      additionalProperties: true

    DdbQueryResolve:
      type: object
      description: |
        Query the database for an advertisement record.
        The query is processed by the relay node that receives this message.
        The relay node responds with a `DdbQueryResponse` message.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["queryResolve"]
          description: queryResolve
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        id:
          type: string
          description: The identifier of the node we require the advertisement record for, an Algorand address.
      required: [app, type, id]
      additionalProperties: true

    DdbSignon:
      type: object
      description: |
        Sign on as a relay node to the DDB.
        This message is sent when the relay node has completed its initialization and has received all database records.
        This causes the epoch number to be incremented, indicating a new configuration.
        The message ripples onward to all configured nodes in the graph.
        A `DdbSignonResponse` is sent back to the sender.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["signon"]
          description: signon
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        startId:
          type: string
          description: The identifier of the new node that is signing on, an Algorand address.
        originalSignature:
          type: string
          description: A ed25519 signature of `startId` + `epoch` by the node making the request.
        rippled:
          type: boolean
          description: True if the message was rippled to the database.
      required: [app, type, startId]
      additionalProperties: true

    DdbGetEpoch:
      type: object
      description: |
        Get an epoch number together with database graph configuration details.
        Can be sent to any initialized relay node.
        This retrieves data for any loaded epoch including the current one.
        The relay node responds with a `DdbEpochInfo` message.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["getEpoch"]
          description: getEpoch
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        epochId:
          type: integer
          description: The epoch number to retrieve, -1 to retrieve the current epoch.
      required: [app, type, epochId]
      additionalProperties: true

    DdbInitResolve:
      type: object
      description: |
        Called to start initializing a new relay node.
        Sent to the DDB node selected by the sender id and current epoch.
        The relay node responds with a `DdbInitResponse` message followed by `DdbDumpResolveResponse` messages for each record in the database.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["initResolve"]
          description: initResolve
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
      required: [app, type]
      additionalProperties: true

    DdbDumpResolve:
      type: object
      description: |
        Sent from an existing, active relay node to a new, initializing relay node.
        Contains a single record from the database.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["dumpResolve"]
          description: dumpResolve
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        record:
          $ref: '#/components/schemas/AdvertRecord'
      required: [app, type, record]
      additionalProperties: true

    # Responses
    DdbUpdateResponse:
      type: object
      description: |
        Sent from a relay node to the sender of a `DdbUpsertResolve` or `DdbDeleteResolve` message.
        Indicates that the update was successful.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["updateResponse"]
          description: updateResponse
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
      required: [app, type]
      additionalProperties: true

    DdbSignonResponse:
      type: object
      description: |
        Sent from a relay node to the sender of a `DdbSignon` message.
        Indicates that the update was successful.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["signonResponse"]
          description: signonResponse
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
      required: [app, type]
      additionalProperties: true

    DdbEpochInfo:
      type: object
      description: |
        Sent from a relay node to the sender of a `DdbGetEpoch` message, or sent to all nodes when the epoch changes.
        Provides the database graph configuration details.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["getEpochResponse"]
          description: getEpochResponse
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        epochId:
          type: integer
          description: The epoch number requested, or the current epoch number if -1 was specified.
        treeOrder:
          type: integer
          description: The tree order of the database graph, indicating the number of leaves on a node in the NetDet algorithm.
        relayIds:
          type: array
          description: The identifiers of all active relay nodes in the graph.
          items:
            type: string
        relayEndpoints:
          type: array
          description: The IP endpoints of all active relay nodes in the graph.
          items:
            type: object
            properties:
              host:
                type: string
                description: Hostname or IP address.
              port:
                type: integer
                minimum: 1
                maximum: 65535
                description: UDP port number.
            required: [ host, port ]
            additionalProperties: false
            description: Host and port of the relay node.
      required: [app, type, epochId, treeOrder, relayIds]
      additionalProperties: true

    DdbQueryResponse:
      type: object
      description: |
        Sent from a relay node to the sender of a `DdbQueryResolve` message.
        Contains a located advertisement record if found.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["queryResponse"]
          description: queryResponse
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        found:
          type: boolean
          description: True if we found an advert record for the requested id.
        advert:
          description: The advert record if found, null otherwise.
          allOf:
            - $ref: '#/components/schemas/AdvertRecord'
          nullable: true
      required: [app, type, found]
      additionalProperties: true

    DdbInitResponse:
      type: object
      description: |
        Sent from a relay node to the sender of a `DdbInitResolve` message.
        Contains the number of records in the database.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["initResponse"]
          description: initResponse
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        dbCount:
          type: integer
          description: The number of records in the database.
      required: [app, type, dbCount]
      additionalProperties: true

    DdbDumpResolveResponse:
      type: object
      description: |
        Sent from a relay node to the sender of a `DdbDumpResolve` message.
        One response is sent per record in the database.
        The response contains the record index, id and advertisement record.
      properties:
        app:
          type: string
          enum: ["ddb"]
          description: ddb
        type:
          type: string
          enum: ["dumpResolveResponse"]
          description: dumpResolveResponse
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        recordIndex:
          type: integer
          description: The index of the record in the database.
        recordId:
          type: string
          description: The identifier of the node the record describes.
        record:
          $ref: '#/components/schemas/AdvertRecord'
      required: [app, type, recordIndex, recordId, record]
      additionalProperties: true

    AdvertRecord:
      type: object
      description: Advertisement record for a node, as used by the Distributed Database (DDB).
      properties:
        id:
          type: string
          nullable: true
          description: Identifier of the node (Algorand address).
        endpoint:
          nullable: true
          description: Optional network endpoint (IP/hostname and port) for direct DTLS.
          oneOf:
            - type: object
              properties:
                host:
                  type: string
                  description: Hostname or IP address.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: UDP port number.
              required: [host, port]
              additionalProperties: false
            - type: string
              description: Host and port.
        amRelay:
          type: boolean
          nullable: true
          default: false
          description: True if this node provides relay services.
        relayId:
          type: string
          nullable: true
          description: Optional identifier of the relay this node uses.
        relaySig:
          type: string
          nullable: true
          description: Optional signature from the relay verifying this record.
        date:
          type: string
          format: date-time
          description: Record creation or update timestamp (RFC 3339 date-time).
        sig:
          type: string
          nullable: true
          description: Optional signature of this record by the node.
      required: [date, id]
      additionalProperties: false
      example:
        id: "P7JQ...ALGONODEID"
        endpoint:
          host: "203.0.113.10"
          port: 4444
        amRelay: false
        relayId: null
        relaySig: null
        date: "2025-09-05T12:00:00Z"
        sig: "MEUCIQD...BASE64SIG"

    PingPing:
      type: object
      properties:
        app:
          type: string
          enum: ["ping"]
          description: ping
        type:
          type: string
          enum: ["ping"]
          description: ping
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
      required: [app, type]
      additionalProperties: true

    PingResponse:
      type: object
      properties:
        app:
          type: string
          enum: ["ping"]
          description: ping
        type:
          type: string
          enum: ["response"]
          description: response
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        text:
          type: string
          nullable: true
          description: Optional text field if the typed message conveys textual content
        data:
          type: object
          description: Optional structured payload; schema depends on (`app`, `type`)
          additionalProperties: true
        verifiedId:
          type: string
      required: [app, type, verifiedId]
      additionalProperties: true


    InetSocketAddress:
        type: object
        properties:
          host:
            type: string
            description: Hostname or IP address.
          port:
            type: integer
            minimum: 1
            maximum: 65535
            description: UDP port number.
        required: [host, port]
        additionalProperties: false

    RelayCall:
      type: object
      description: |
        Make a call to a node through a relay.
        This command is sent from a node to a relay.
        The relay establishes a channel to the `calledId` node.
        The relay responds with a `RelayResponse` message.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["Call"]
          description: Call
        calledId:
          type: string
          description: The identifier of the node to call.
      required: [app, type, calledId]

    RelayResponse:
      type: object
      description: |
        Response message from a relay to a `RelayCall` message.
        Indicates that a relay channel has been established.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["RelayResponse"]
          description: RelayResponse
        channel:
          type: integer
          description: The channel number of the relay channel.
          nullable: true
      required: [app, type]

    RelayTriangleTest1:
      type: object
      description: |
        Called to initiate a relay triangle test.
        This is used in determining if the initiating node is connected to the internet with "Full Cone" or "Restricted Cone" NAT.
        With full cone NAT, the relay node is able to establish a direct connection to the called node, indicating that the IP and port number is consistent to all other internet endpoints.
        With restricted cone NAT, the relay node is not able to establish a direct connection to the called node.
        This message causes the relay node to send a `RelayTriangleTest2` message to a peer relay node.
        Any response (`TriangleTest3`) is generated by that node.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["TriangleTest1"]
          description: TriangleTest1
        checkingEndpoint:
          $ref: '#/components/schemas/InetSocketAddress'
      required: [app, type, checkingEndpoint]

    RelayTriangleTest2:
      type: object
      description: |
        Received by the second relay in a triangle test.
        Will attempt to send a `RelayTriangleTest3` message to the originating endpoint (CheckingEndpoint).
        If this message is received, it indicates that the checkingId node has full cone NAT.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["TriangleTest2"]
          description: TriangleTest2
        checkingId:
          type: string
          description: The identifier of the node that initiated the test.
        checkingEndpoint:
          $ref: '#/components/schemas/InetSocketAddress'
      required: [app, type, checkingId, checkingEndpoint]

    RelayTriangleTest3:
      type: object
      description: |
        Response sent by the second relay in a triangle test.
        If received after a test is initiated, indicates that the node receiving this message has full cone NAT.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["TriangleTest3"]
          description: TriangleTest3
      required: [app, type]

    RelayListen:
      type: object
      description: |
        Sent to a relay node to inform that relay node to pass on messages for the originating node.
        The relay node responds with a `RelayListenResponse` message.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["Listen"]
          description: Listen
      required: [app, type]

    RelayCheck:
      type: object
      description: |
        Sent to a relay node to check if it is available.
        The relay node responds with a `RelayCheckResponse` message.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["Check"]
          description: Check
      required: [app, type]

    RelayListenResponse:
      type: object
      description: |
        Response to a `RelayListen` message.
        When received, indicates that the relay listener is set up.
        The relay node will pass on messages for the originating node.
        The receiver can then advertise the relay endpoint.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["ListenResponse"]
          description: ListenResponse
      required: [app, type]

    RelayCheckResponse:
      type: object
      description: Response to a `RelayCheck` message. |
        Indicates the relay state.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["CheckResponse"]
          description: CheckResponse
        state:
          type: string
          description: |
            Relay state string: one of "off", "starting", or "available".
      required: [app, type, state]

    RelayCallResponse:
      type: object
      description: Response to a `RelayCall` message. |
        Provides the channel number of the relay channel and the id of the node being called. |
        TURN encapsulated messages can then be sent via the relay node and channel.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["CallResponse"]
          description: CallResponse
        calledId:
          type: string
        channel:
          type: integer
      required: [app, type, calledId, channel]

    RelayKeepAlive:
      type: object
      description: Keep-alive message. |
        Sent from a node to a relay when a call is active to indicate that |
        the call should be kept open.
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for Relay commands.
        type:
          type: string
          enum: ["KeepAlive"]
          description: KeepAlive
      required: [app, type]

    Fail:
      type: object
      description: |
        Generic failure message used when a command cannot be processed.
        This message uses a null app namespace and a type of "fail".
      properties:
        app:
          nullable: true
          enum: [null]
          description: Must be null for generic failure messages.
        type:
          type: string
          enum: ["fail"]
          description: fail
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        reason:
          type: string
          description: Human-readable reason for the failure.
      required: [app, type, reason]
      additionalProperties: true

    # Mutex messages (app: "mutex")
    MutexRequest:
      type: object
      description: |
        Request to acquire a distributed mutex using Lamport timestamps.
      properties:
        app:
          type: string
          enum: ["mutex"]
          description: mutex
        type:
          type: string
          enum: ["request"]
          description: request
        responseTag:
          type: string
          nullable: true
          description: Optional correlation tag for responses.
        lamport_timestamp:
          type: integer
          format: int64
          description: Requester's Lamport timestamp for ordering.
        known_ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Unique list of node IDs known by the requester.
      required: [app, type, lamport_timestamp]
      additionalProperties: true

    MutexResponse:
      type: object
      description: |
        Response to a MutexRequest. Presence of this message indicates peers have observed the request.
      properties:
        app:
          type: string
          enum: ["mutex"]
          description: mutex
        type:
          type: string
          enum: ["response"]
          description: response
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        known_ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Unique list of node IDs known by the responder.
      required: [app, type]
      additionalProperties: true

    MutexRelease:
      type: object
      description: |
        Notification that the mutex is being released by the current holder.
      properties:
        app:
          type: string
          enum: ["mutex"]
          description: mutex
        type:
          type: string
          enum: ["release"]
          description: release
        tag:
          type: string
          nullable: true
          description: Optional correlation tag for request/response association.
        known_ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Unique list of node IDs known by the holder.
      required: [app, type]
      additionalProperties: true
