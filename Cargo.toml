[package]
name = "rust_comms"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_comms"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Core deps kept iOS-friendly; heavy platform-specific deps remain gated below.
base64 = "0.21"
data-encoding = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
stun-rs = "0.1.11"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
algonaut = "0.4.2"
anyhow = "1"
base64 = "0.21"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
openssl = { version = "0.10" }
openssl-sys = { version = "0.9" }

[workspace]
members = [
    ".",
    "bingle_test",
]

[dev-dependencies]
bingle_test = { path = "bingle_test" }
tempfile = "3"
ntest = "0.9"



[[test]]
name = "algo_ops_test"
path = "tests/blockchain/algo_ops_test.rs"

