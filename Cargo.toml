[workspace]
resolver = "3"
members = [
    "bingle_core",
    "bingle_test",
    "bingle_webserver",
    "bingle_local",
    "bingle_jsi",
    "bingle_cli",
]

# Workspace-wide clippy settings. Members opt in with `[lints] workspace = true`; see
# scripts/run_quality_checks.sh. The old backlog of allowed lints is cleared (#11-#17): every
# lint is at its default level, and the few deliberate exceptions are per-item
# `#[allow(..., reason = "...")]` attributes next to the code they cover.
[workspace.lints.clippy]

# AES-GCM is very slow unoptimised, and the sealed state file (#459) runs it on every save, so
# debug builds and tests optimise the cipher crates, and the vault and keystore crates where the
# generic cipher code is instantiated. Release builds are unaffected.
[profile.dev.package.blockchain_account_vault]
opt-level = 3
[profile.dev.package.blockchain_keystore]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3

# TEMPORARY (#497): sidewinder_ops 0.10.0 (every advertised node address, IPv6 first, NAT64) is not yet
# published. Replace this git pin with the published 0.10.0 crates (richdrich/blockchain_ops_rust#148)
# before the PR is marked ready. algo_ops, blockchain_ops and sw_identity_tls move with it, so the
# AlgoOps handle the bingle crates pass to sidewinder_ops is one type.
[patch.crates-io]
blockchain_ops = { git = "https://github.com/richdrich/blockchain_ops_rust", branch = "feat/146-multi-address" }
algo_ops = { git = "https://github.com/richdrich/blockchain_ops_rust", branch = "feat/146-multi-address" }
sidewinder_ops = { git = "https://github.com/richdrich/blockchain_ops_rust", branch = "feat/146-multi-address" }
sw_identity_tls = { git = "https://github.com/richdrich/blockchain_ops_rust", branch = "feat/146-multi-address" }
