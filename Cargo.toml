[workspace]
resolver = "3"
members = [
    "bingle_core",
    "bingle_test",
    "bingle_webserver",
    "bingle_local",
    "bingle_jsi",
    "bingle_cli",
]

# Workspace-wide clippy settings. Members opt in with `[lints] workspace = true`; see
# scripts/run_quality_checks.sh. The old backlog of allowed lints is cleared (#11-#17): every
# lint is at its default level, and the few deliberate exceptions are per-item
# `#[allow(..., reason = "...")]` attributes next to the code they cover.
[workspace.lints.clippy]
