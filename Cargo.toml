[package]
name = "rust_comms"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_comms"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Core deps kept iOS-friendly; heavy platform-specific deps remain gated below.
base64 = "0.21"
data-encoding = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
algonaut = "0.4.2"
anyhow = "1"
base64 = "0.21"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[workspace]
members = [
    ".",
    "bingle_test",
]

[dev-dependencies]
bingle_test = { path = "bingle_test" }
