[package]
name = "rust_comms"
version = "0.1.0"
edition = "2024"

[dependencies]
algonaut = "0.4.2"
anyhow = "1"
thiserror = "1"
base64 = "0.21"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
