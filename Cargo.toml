[workspace]
resolver = "3"
members = [
    "bingle_core",
    "bingle_test",
    "bingle_webserver",
    "bingle_local",
    "bingle_jsi",
    "bingle_cli",
]

# Workspace-wide clippy settings. Members opt in with `[lints] workspace = true`; see
# scripts/run_quality_checks.sh. The old backlog of allowed lints is cleared (#11-#17): every
# lint is at its default level, and the few deliberate exceptions are per-item
# `#[allow(..., reason = "...")]` attributes next to the code they cover.
[workspace.lints.clippy]

# AES-GCM is very slow unoptimised, and the sealed state file (#459) runs it on every save, so
# debug builds and tests optimise the cipher crates, and the vault and keystore crates where the
# generic cipher code is instantiated. Release builds are unaffected.
[profile.dev.package.blockchain_account_vault]
opt-level = 3
[profile.dev.package.blockchain_keystore]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
