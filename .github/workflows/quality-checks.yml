name: quality-checks

# Run rustfmt + clippy (via scripts/run_quality_checks.sh) on every pull request
# and on pushes to staging. The script's --strict mode is the gate: formatting
# must be clean and clippy must pass with -D warnings. The clippy backlog is
# silenced centrally in [workspace.lints.clippy] (Cargo.toml, issues #33-#39),
# so --strict is expected to pass. The job is named "quality" — require that
# check in branch protection to block merge. See CI-UNIT-TESTS.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [staging]

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustfmt + clippy components are required by the script. openssl is
      # vendored, so clippy's build compiles it from source (perl + cc are
      # preinstalled on ubuntu-latest) — no system libs needed.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # --strict: fmt must be clean and clippy runs with -D warnings; the script
      # exits non-zero on any issue, failing the job and blocking merge.
      - name: Run quality checks (strict)
        run: scripts/run_quality_checks.sh --strict

  # TypeScript typecheck for the bingle_jsi example (app + Detox e2e + the committed
  # generated bindings). Kept a separate job so the Node toolchain does not weigh down
  # the Rust gate above. The generated ts/index.ts is committed, so no native build is
  # needed — just install JS deps and run tsc --noEmit (issue #142).
  typecheck-example:
    name: typecheck-example
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        working-directory: bingle_jsi/example
        run: npm install --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        working-directory: bingle_jsi/example
        run: npm run typecheck
