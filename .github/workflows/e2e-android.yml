name: e2e-android

# Android Detox end-to-end (e2e) on a Linux runner (issue #132). Unlike macOS runners (no Docker /
# no nested virt — see #110), ubuntu-latest has KVM, so a hardware-accelerated Android emulator runs
# here. This lane runs the Detox smoke suite, which queries an in-CI algokit localnet reached via
# adb-reverse.
#
# The messaging/failure network suites are NOT run here: the CI emulator has no outbound internet
# (verified — no route to 8.8.8.8), so the testnet path is impossible in CI. Hermetic network
# coverage needs the localnet emulator-mode provisioner (10.0.2.2, no internet) — follow-up #37.
# Until then, run the network suites locally (run_e2e_android.sh, an emulator with internet + #135).
#
# Runs on pushes to staging and manual dispatch only. See CI-E2E.md.
on:
  push:
    branches: [staging]
  workflow_dispatch:

# Latest-push-wins ("heap not queue").
concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-e2e:
    name: android-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Android package id of the example app (matches example/android/app/build.gradle).
      ANDROID_PKG: com.binglejsiexample
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust toolchain (+ Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The smoke suite's default init points at localnet (localhost:4001); Detox adb-reverses
      # 4001/8980 to the runner host, so bring up algokit localnet there for the chain query to
      # resolve. Linux runners have Docker natively (no Colima needed, unlike macOS — see #110).
      - name: Start algokit localnet
        run: |
          pipx install algokit
          algokit localnet start
          for _ in $(seq 1 60); do
            (nc -z localhost 4001 && nc -z localhost 8980) && break
            sleep 2
          done
          nc -z localhost 4001 && nc -z localhost 8980 || { echo "localnet not reachable"; exit 1; }

      - name: Install Android SDK packages (NDK, platform, cmake)
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # build_android.sh formats the uniffi-generated Kotlin with ktlint.
      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint && sudo mv ktlint /usr/local/bin/

      - name: Build the Android native library (jniLibs + Kotlin bindings)
        # The CI emulator is x86_64, so build only that ABI (fast) rather than all three.
        env:
          BINGLE_ANDROID_ABIS: x86_64
        run: bash bingle_jsi/scripts/build_android.sh

      - name: Install JS dependencies
        working-directory: bingle_jsi/example
        run: npm install --legacy-peer-deps

      - name: Build the app + androidTest APKs (Detox)
        working-directory: bingle_jsi/example
        run: npm run e2e:build:android

      # KVM permissions for a hardware-accelerated emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox e2e on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BINGLE_E2E_BACKEND: testnet
          BINGLE_E2E_ECHO_TO: echo-testnet-1
          # Intentionally NOT passing the funded-sender secrets: the CI emulator has no internet, so
          # the testnet network suites can't run here — they skip cleanly (smoke only). Network
          # coverage arrives with the localnet emulator-mode (#37), which needs no secrets.
          BINGLE_E2E_AVD: detox_avd
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: detox_avd
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -netdelay none -netspeed full
          disable-animations: true
          script: bash bingle_jsi/example/scripts/ci_run_android_e2e.sh

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: bingle_jsi/example/artifacts
          if-no-files-found: ignore
