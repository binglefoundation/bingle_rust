AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bingle Relay Server - Express Mode (Fargate)'

Parameters:
  RelayPort:
    Type: String
    Default: '12121'
  ImageUri:
    Type: String
  Handle:
    Type: String
  Passphrase:
    Type: String
    NoEcho: true
  NatMode:
    Type: String
    Default: 'Direct'
  NodeFile:
    Type: String
    Default: '/app/nodely_staging_testnet_node.json'
  CostTag:
    Type: String
    Default: 'bingle_dev'

  AutoMigrate:
    Type: String
    Default: '0'
    AllowedValues: [ '0', '1' ]
    Description: "'1' migrates the relay account from a blessed ancestor app at start, when it is not yet registered on the configured app"

Resources:
  # Simple VPC setup (using a single public subnet for 'express')
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  # Dual stack (#502): an Amazon-provided /56 IPv6 block on the VPC, a /64 of it on the subnet,
  # and a ::/0 route through the internet gateway. IPv6 addresses are public, so there is no NAT
  # and no charge; IPv4 is unchanged for IPv4-only clients.
  VPCIpv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPC
      AmazonProvidedIpv6CidrBlock: true

  Subnet:
    Type: AWS::EC2::Subnet
    # the VPC's IPv6 block exists only once VPCIpv6CidrBlock is associated
    DependsOn: VPCIpv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      Ipv6CidrBlock: !Select [ 0, !Cidr [ !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ], 1, 64 ] ]
      AssignIpv6AddressOnCreation: true
      MapPublicIpOnLaunch: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  DefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  DefaultRouteIpv6:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationIpv6CidrBlock: ::/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # Security Group
  RelaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Bingle Relay (Express)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: !Ref RelayPort
          ToPort: !Ref RelayPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: !Ref RelayPort
          ToPort: !Ref RelayPort
          CidrIpv6: ::/0
      # A new security group allows all outbound IPv4 only; listing the egress rules replaces
      # that default, so the IPv4 rule is restated next to the IPv6 one.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
        - IpProtocol: '-1'
          CidrIpv6: ::/0

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-Cluster"
      Tags:
        - Key: CostCenter
          Value: !Ref CostTag

  # IAM Roles
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: GetSecretsAndParams
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                Resource:
                  - !Ref RelayPassphraseSecret
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bingle/relay/*'
        - PolicyName: CreateLogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                # The log-group ARN, which CloudWatch Logs requires for log-group actions from
                # 26 April 2027 (#376), and the old stream-format ARN for regions not yet switched.
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/bingle/relay/${AWS::StackName}'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/bingle/relay/${AWS::StackName}:*'

  # Secrets and Parameters
  RelayPassphraseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/bingle/relay/${AWS::StackName}/passphrase"
      SecretString: !Ref Passphrase

  RelayHandleParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/bingle/relay/${AWS::StackName}/handle"
      Type: String
      Value: !Ref Handle

  # Task Definition (Fargate). The task's network interface (ENI) gets an IPv6 address from the
  # dual-stack subnet, for the task's lifetime, when the ECS account setting dualStackIPv6 is
  # enabled in the region (a one-off, see DEVELOPER.md); without it the task stays IPv4-only.
  RelayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-Task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: relay
          Image: !Ref ImageUri
          Essential: true
          # On SIGTERM the relay clears its on-chain static endpoint (#500), an Algorand
          # transaction that confirms in about 3-5 s; 120 s (the Fargate maximum) leaves ample time
          # before SIGKILL. The service stops the old task before starting its replacement (below).
          StopTimeout: 120
          Environment:
            - Name: RELAY
              Value: '1'
            - Name: AWS
              Value: '1'
            - Name: AUTO_MIGRATE
              Value: !Ref AutoMigrate
            - Name: PORT
              Value: !Ref RelayPort
            - Name: NAT_MODE
              Value: !Ref NatMode
            - Name: NODE_FILE
              Value: !Ref NodeFile
          Secrets:
            - Name: PASSPHRASE
              ValueFrom: !Ref RelayPassphraseSecret
            - Name: HANDLE
              ValueFrom: !Ref RelayHandleParam
          HealthCheck:
            Command:
              - CMD-SHELL
              - "pgrep bingle_cli > /dev/null || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RelayLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: relay
              awslogs-create-group: "true"
              awslogs-datetime-format: "%Y-%m-%dT%H:%M:%S"

  RelayLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub "/bingle/relay/${AWS::StackName}"
      RetentionInDays: 7

  RelayService:
    Type: AWS::ECS::Service
    DependsOn:
      - VPCGatewayAttachment
      - DefaultRoute
      - DefaultRouteIpv6
      - SubnetRouteTableAssociation
    Properties:
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref RelayTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        # stop the old task before starting the new one: the old task unregisters the
        # static endpoint on shutdown and would otherwise clobber the record the
        # replacement task has just registered
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref Subnet
          SecurityGroups:
            - !Ref RelaySecurityGroup

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
  ServiceName:
    Value: !GetAtt RelayService.Name
