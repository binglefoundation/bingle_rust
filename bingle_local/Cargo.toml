[package]
name = "bingle_local"
version = "0.2.4"
edition = "2024"
description = "Local API crate for storing messages and contacts for Bingle (placeholder)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
autotests = false

[lib]
name = "bingle_local"
path = "src/lib.rs"

[dependencies]
bingle_core = { path = "../bingle_core", version = "0.2.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
# Unit tests: all bingle_local tests are local unit-style tests.
name = "unit"
path = "tests/api.rs"

[dev-dependencies]
tempfile = "3"
bingle_test = { path = "../bingle_test" }

[lints]
workspace = true
