[package]
name = "bingle_local"
version = "3.0.1"
edition = "2024"
description = "Local API crate for storing messages and contacts for Bingle (placeholder)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
readme = "README.md"
autotests = false

# docs.rs build metadata; see docs/api-surface.md.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bingle_local"
path = "src/lib.rs"

[dependencies]
bingle_core = { path = "../bingle_core", version = "3.0.1" }
algo_ops = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Give-up nudge (bingle_notify #11): sign the canonical /alert envelope and POST it best-effort.
base64 = "0.21"
getrandom = "0.2"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[[test]]
# Unit tests: all bingle_local tests are local unit-style tests.
name = "unit"
path = "tests/api.rs"

[dev-dependencies]
tempfile = "3"
bingle_test = { path = "../bingle_test" }

[lints]
workspace = true
