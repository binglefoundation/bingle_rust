[package]
name = "bingle_local_ios"
version = "0.3.34"
edition = "2024"
description = "iOS Keychain storage for the Bingle recovery phrase: a bingle_local KeyStore."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
readme = "README.md"
# Only bingle_jsi uses it, and that builds from the workspace, so it isn't published to crates.io.
publish = false
autotests = false

[features]
# `MemoryItems`: an in-memory Keychain fake for host tests. Never enable it in app builds.
test-support = []

[dependencies]
# the KeyStore trait this crate implements, and the Keypair it stores.
bingle_local = { path = "../bingle_local", version = "0.3.34" }
# the versioned Keychain records are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# The real Keychain backend: SecItem calls through security-framework-sys, because a synced item
# needs kSecAttrAccessible (access-control objects can't be synchronised), which the safe
# security-framework password API doesn't expose.
[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2.17"

[dev-dependencies]
# the unit tests use the in-memory Keychain fake.
bingle_local_ios = { path = ".", features = ["test-support"] }
bingle_test = { path = "../bingle_test" }

[lints]
workspace = true

# ── Test targets ─────────────────────────────────────────────────────────────
[[test]]
# Unit tests: the key store logic against the in-memory Keychain fake. No device needed.
name = "unit"
path = "tests/unit.rs"
