[package]
name = "bingle_jsi"
version = "0.2.0"
edition = "2024"
description = "React Native JSI bridge for Bingle using uniffi proc macros."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
# React Native bridge crate — not consumed as a library dependency, so not published to crates.io.
publish = false
autotests = false

[lib]
name = "bingle_jsi"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"
bingle_core = { path = "../bingle_core", version = "0.2.0" }
bingle_local = { path = "../bingle_local", version = "0.2.0" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
uniffi = { version = "0.28", features = ["build"] }
tempfile = "3"
bingle_test = { path = "../bingle_test" }

[build-dependencies]
vergen = { version = "8", features = ["build", "git", "gitcl", "cargo"] }

# Unit tests: all bingle_jsi tests are local unit-style tests.
[[test]]
name = "unit"
path = "tests/all.rs"

[lints]
workspace = true
