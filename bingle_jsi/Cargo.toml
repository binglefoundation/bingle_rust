[package]
name = "bingle_jsi"
version = "0.1.1"
edition = "2024"
description = "React Native JSI bridge for Bingle using uniffi proc macros."
autotests = false

[lib]
name = "bingle_jsi"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"
bingle_core = { path = "../bingle_core" }
bingle_local = { path = "../bingle_local" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
uniffi = { version = "0.28", features = ["build"] }
tempfile = "3"

[build-dependencies]
vergen = { version = "8", features = ["build", "git", "gitcl", "cargo"] }

[[test]]
name = "bingle_jsi_tests"
path = "tests/all.rs"
