// Android library module for the Bingle JSI React Native module.
//
// This build file configures:
//   - Pre-built native shared libraries (jniLibs) produced by build_android.sh
//   - Kotlin bindings generated by uniffi-bindgen
//
// Prerequisites: Run `bash bingle_jsi/scripts/build_android.sh` before building.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.bingle.jsi'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    sourceSets {
        main {
            // Include uniffi-generated Kotlin bindings
            java.srcDirs += ['generated']
            // Pre-built native libraries
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
