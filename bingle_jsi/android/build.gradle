// Android library module for the Bingle JSI React Native module.
//
// This build file configures:
//   - Pre-built native shared libraries (jniLibs) produced by build_android.sh
//   - Kotlin bindings generated by uniffi-bindgen
//   - React Native bridge classes (BingleJsiModule + BingleJsiPackage)
//
// Prerequisites: Run `bash bingle_jsi/scripts/build_android.sh` before building.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.bingle.jsi'
    // Match the example app's compileSdk; react-android (RN 0.84) requires a recent compileSdk.
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
    }

    sourceSets {
        main {
            // Include uniffi-generated Kotlin bindings
            java.srcDirs += ['generated']
            // React Native bridge classes
            java.srcDirs += ['src/main/java']
            // Pre-built native libraries
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // RN 0.84's react-android is built for Java 17; consumers must compile at 17 too.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
