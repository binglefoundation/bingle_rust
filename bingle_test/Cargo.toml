[package]
name = "bingle_test"
version = "0.2.1"
edition = "2024"
# Test-support crate — never published to crates.io.
publish = false

[lib]
name = "bingle_test"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.21"
data-encoding = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Depend on the main crate for real backend access to AlgoOps
bingle_core = { path = "../bingle_core" }

[lints]
workspace = true
